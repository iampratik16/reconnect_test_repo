name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: STATIC_EXPORT=1 npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /reconnect_website
          # Google Apps Script Web App that records form submissions to the
          # leads sheet (public by nature — NEXT_PUBLIC_* is exposed client-side).
          NEXT_PUBLIC_LEADS_ENDPOINT: https://script.google.com/macros/s/AKfycbweC7RwlimNZiVs-iH2GFLjl4eVt5vLnrpGpdrWYkedyQ9DXpm0Rgq-1sZ9xBDNKeMy/exec

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
